name: Build and Upload YouTube Shorts

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      privacy_status:
        description: 'Privacy status'
        default: 'private'
  schedule:
    - cron: '0 14 * * *'   # = 4م بتوقيت القاهرة تقريبًا
    - cron: '0 18 * * *'   # = 8م بتوقيت القاهرة تقريبًا
    - cron: '0 23 * * *'   # = 1ص بتوقيت القاهرة تقريبًا

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          pip install -r requirements.txt

      - name: Select idea for this run
        run: python scripts/select_idea.py

      - name: Generate audio, metadata, and videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python scripts/generate_audio.py
          python scripts/generate_metadata.py
          python scripts/build_video.py

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts-output
          path: |
            output/*.mp4
            output/*_meta.json

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy_status || 'private' }}
        run: |
          python scripts/upload_youtube.py

      - name: Record published video
        run: |
          git config user.name "psych-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/published_ids.json
          git commit -m "chore: record published video" || echo "nothing to commit"
          git pull --rebase origin main
          git push
