name: Build YouTube Shorts

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Generate audio, metadata, and videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python scripts/generate_audio.py
          python scripts/generate_metadata.py
          python scripts/build_video.py

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts-output
          path: |
            output/*.mp4
            output/*_meta.json

  - name: Upload video to YouTube
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      UPLOAD_IDEA_ID: ${{ inputs.idea_id || '1' }}
      YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy_status || 'private' }}
    run: |
      python scripts/upload_youtube.py
